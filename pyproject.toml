[project]
name = "agentcraft"
version = "0.4.0"
description = "AgentCraft scaffold-only workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",
    "python-multipart>=0.0.32",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt==4.0.1",
    "aiodocker>=0.27.0",
    "cryptography>=50.0.1",
    "asyncpg>=0.31.0",
    "testcontainers>=4.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C90"]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入的标准写法即函数默认值中调用 Depends()
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.ruff.lint.per-file-ignores]
# conftest.py 末尾追加的 V2 PostgreSQL 夹具块刻意自带 import（不依赖文件头部引入顺序）
"tests/conftest.py" = ["E402", "F811"]
