name: agentcraft

services:
  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - "${HOST_WORKSPACE_ROOT:-./workspace}:/workspaces/authorized:ro"
      - "${HOST_DATA_ROOT:-./data}:/data:rw"
    depends_on:
      - docker-socket-proxy
      - provider-proxy

  provider-proxy:
    image: provider-proxy:placeholder
    expose:
      - "8080"
    networks:
      - internal
    environment:
      # Sup §10.10 钉一：grant 兑换专用凭据（.env 供给；task 容器 env 禁出现）
      PROXY_GRANT_SECRET: ${PROXY_GRANT_SECRET:-}

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  pi-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pi-worker
    image: agentcraft-pi-worker:0.84.3
    profiles:
      - pi-worker
    networks:
      - internal

networks:
  internal:
    internal: true
