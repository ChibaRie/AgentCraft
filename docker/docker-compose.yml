# 本地开发 / 镜像构建用。生产拓扑见 Ops Spec §2：不得照搬这里的 ports
# 与 docker-socket-proxy（生产由 nginx/gVisor/runner-manager/egress 承担）。
name: agentcraft

services:
  control:
    build:
      context: ..
      dockerfile: docker/Dockerfile.control
    container_name: agentcraft-control
    # dev 回环发布；生产集成由 nginx 终结 TLS 后转发
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # 任务容器网络名必须与 compose 实际网络名一致（项目名 agentcraft +
      # 网络键 internal → agentcraft_internal），否则回调/代理 DNS 不可达。
      PI_NETWORK_NAME: agentcraft_internal
    env_file:
      - path: ../.env
        required: false
    volumes:
      - "${HOST_WORKSPACE_ROOT:-./workspace}:/workspaces/authorized:ro"
      - "${HOST_DATA_ROOT:-./data}:/data:rw"
    networks:
      default: {}
      internal:
        aliases:
          # provider-proxy 兑换 grant 时的控制面别名（Phase 9 T1：
          # 与 dev 形态转发容器同名，两种形态共用一份默认 URL）
          - agentcraft-control
    depends_on:
      - docker-socket-proxy
      - provider-proxy

  provider-proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile.provider-proxy
    image: agentcraft-provider-proxy:latest
    container_name: provider-proxy
    expose:
      - "8080"
    # 与 dev 形态 docker_ensure_proxy_container 同构：代码只读挂载 + .env 注入，
    # 真实 Key/密钥环不进入镜像层。
    volumes:
      - "..:/app:ro"
      - "../.env:/app/.env:ro"
    env_file:
      - path: ../.env
        required: false
    networks:
      - internal
      # bridge（compose default）供出网到用户 Provider 上游；internal 网络无路由。
      # 与 dev 形态 docker_ensure_proxy_container 的 internal+bridge 双网络同构。
      - default
    environment:
      # Phase 9 T1：grant 控制面地址（internal 网络内 agentcraft-control 别名）
      PROVIDER_PROXY_GRANT_URL: ${PROVIDER_PROXY_GRANT_URL:-http://agentcraft-control:8000/internal/provider-grant}

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal

  pi-worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pi-worker
    image: agentcraft-pi-worker:0.84.3
    profiles:
      - pi-worker
    networks:
      - internal
  # MCP stdio 沙箱镜像（Phase 10 M5）：仅用于镜像构建；控制面每次发现/调用经
  # `docker run`（ContainerSpec，--rm 一次性）从该镜像拉起，不作为常驻服务运行。
  mcp-sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mcp-sandbox
    image: agentcraft-mcp-sandbox:latest
    profiles:
      - mcp-sandbox
    networks:
      - internal

networks:
  internal:
    internal: true
